# 원 데이터셋(taxonomy) 번호 17 '난임시술기관 보급도', 21 '학교폭력
# 발생률'은 재정팀 원본 파일에 '(폐기?)'로 표시돼 있었다.
# 둘 다 폐기로 확정되어 이 매니페스트에 등록하지 않는다.
# (프로젝트 구조환경지표 목표치: 30개 → 28개로 조정)
