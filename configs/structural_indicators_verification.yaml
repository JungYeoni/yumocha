    limitations:
      - >-
        조사대상주간에 선거일·대체공휴일이 포함된 시점(2020 상반기,
        2021 하반기, 2022 하반기)은 36시간 이상 근로자 비율이 기계적으로
        낮아질 수 있다. 2020 상반기는 코로나19 영향도 함께 고려해야 한다.
      - 세종·제주처럼 분모 표본이 작은 시도는 반기별 추정치 변동성이 크다.
      - 복합표본설계 표준오차·신뢰구간은 제공하지 않는다.

