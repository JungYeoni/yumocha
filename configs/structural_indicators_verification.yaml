  - id: 'youth_household_rent_to_income_ratio'
    project_code: '1-2.3'
    category: '경제·고용·주거'
    subcategory: '주거 안정성'
    name: '주거비'
    status: 'team_calculated'
    direction: 'negative'
    calculation_type: 'weighted_regional_mean'
    official_formula: >-
      표본별 [(보증금 × 해당 지역 연평균 전월세전환율) + (월세 × 12)]
      산출 후 지역평균 (RIR: Rent to Income Ratio)
    recommended_formula: >-
      청년 임차가구(점유형태 2–6)별 HCC = 보증금 × 연평균
      전월세전환율/100 + 월세 × 12, RIR = HCC ÷ (월가구소득 × 12) × 100을
      계산한 뒤 가구 가중치로 평균한다. 소득 0 이하·결측, 임차료 결측,
      음수, 전환율 매칭 누락, 비양수 가중치는 제외하며 극단값은
      제거하지 않는다.
    notebook: 'notebooks/20260727_EDA_주거실태조사_주거지표3종산출_비교.ipynb'
    output_file: 'data/processed/청년가구_월소득_대비_주택임대료_비율_2016-2024.csv'
    raw_sources:
      - role: 'microdata'
        source: '주거실태조사 0727 원자료(MDIS)'
        file_pattern: '{연도}_일반가구_*.csv, 2016–2024년'
        local_path: 'data/raw/구조환경지수 원데이터 구축용/주거실태조사/0727/'
      - role: 'conversion_rate'
        source: 'KOSIS 지역별 전월세전환율(월별 → 연평균)'
    limitations:
      - 2016년 세종은 결측(주택가격·자가점유비율과 동일 결합표본 처리).
      - 전세(2)의 월세, 무보증 월세 계열(4–6)의 보증금 등 구조적 공란에만 0을 부여했다.

