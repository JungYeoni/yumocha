scope:
  official_indicators: 31
  project_structural_indicators: 28
  completed_indicators_to_validate: 28
  note: >-
    제주여성가족연구원 공식 31개 지표 중 저출생 대응 예산액을 별도
    재정대응지수로 분리한 프로젝트 구조환경지표는 원래 30개였다. 이슈
    #38에서 21개를 검증했고, 이슈 #44(하위 #48·#49·#50)에서 청년층
    정규직 근로자 비율·주거지표 3종(주택가격·자가점유비율·주거비)·
    가사수행 격차 2종·사회경제적 지위 인식까지 7개를 추가 구축해
    이슈 #59에서 28개로 매니페스트를 최신화했다. 원 데이터셋(taxonomy
    번호 17 난임시술기관 보급도, 21 학교폭력 발생률)은 재정팀 원본에
    '(폐기?)'로 표시돼 있었는데, 둘 다 폐기로 확정되어 매니페스트
    대상에서 제외했다. 이에 따라 프로젝트 구조환경지표 목표치도
    30개에서 28개로 조정됐다.
  taxonomy_source: >-
    '수정_데이터셋_목록' 시트, 제주여성가족연구원(2025) 출생환경지수
    데이터셋 수정·검증본(로컬 파일, drive.reference_dataset 참고).
    번호·대분류·중분류·지표특성(+/-)·측정방법의 1차 근거로 사용한다.

rules:
  source_priority:
    - methodology_pdf
    - original_raw_data
    - processed_indicator_file
    - merged_file
    - reference_dataset
  exact_file_name_only: true
  allow_fuzzy_file_matching: false
  fill_missing_values: false
  normalize_or_reverse_direction: false
  keep_official_and_recommended_results_separate: true
  # 드라이브 "원자료" 폴더가 아예 없는 지표들. 계산 과정 없이 공표값을
  # 그대로 쓰는 지표라(팀원 메모: "폴더 없는 세부지표는 원자료 자체가
  # 곧 측정값이라 별도저장X"), 검증할 별도 원자료가 존재하지 않는다.
  no_separate_raw_data_indicators:
    - income_level
    - private_education_cost
    - cultural_facilities_supply
    - urban_park_supply

